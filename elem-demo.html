<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>元素反应实验场 · Noita 化验证</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #07090c; }
      body {
        font-family: "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
        color: #e8eef4;
        display: flex;
      }
      #panel {
        width: 210px;
        height: 100%;
        overflow-y: auto;
        padding: 12px 10px;
        background: rgba(10, 14, 20, 0.92);
        border-right: 1px solid rgba(120, 140, 160, 0.35);
        flex-shrink: 0;
      }
      #panel h1 { font-size: 0.85rem; letter-spacing: 0.12em; margin-bottom: 4px; }
      #panel .sub { font-size: 0.62rem; color: #8a9aab; margin-bottom: 10px; line-height: 1.6; }
      #panel .group { font-size: 0.6rem; color: #66788a; letter-spacing: 0.12em; margin: 10px 0 5px; }
      #panel button {
        display: block;
        width: 100%;
        margin-bottom: 5px;
        padding: 0.42rem 0.5rem;
        font-family: inherit;
        font-size: 0.72rem;
        letter-spacing: 0.05em;
        text-align: left;
        color: #c5d6e4;
        background: rgba(14, 18, 24, 0.9);
        border: 1px solid rgba(120, 140, 160, 0.35);
        border-radius: 6px;
        cursor: pointer;
      }
      #panel button:hover { border-color: #7ea0b8; color: #fff; }
      #panel button.active { border-color: currentColor; background: rgba(30, 44, 58, 0.95); color: #fff; }
      #panel button.active .dot { opacity: 1; }
      #panel button .dot {
        display: inline-block; width: 8px; height: 8px; border-radius: 50%;
        margin-right: 6px; opacity: 0.25; vertical-align: 1px;
      }
      .slot {
        border: 1px solid rgba(120, 140, 160, 0.3);
        border-radius: 8px;
        padding: 6px;
        margin-bottom: 8px;
      }
      .slot.off { opacity: 0.45; }
      .slot .head {
        display: flex; justify-content: space-between; align-items: center;
        font-size: 0.68rem; margin-bottom: 5px; letter-spacing: 0.08em;
      }
      .slot .head .pw {
        cursor: pointer; padding: 2px 8px; border-radius: 5px;
        border: 1px solid rgba(120, 140, 160, 0.4); color: #c5d6e4; font-size: 0.62rem;
      }
      .slot.on .head .pw { border-color: #8dd8cf; color: #8dd8cf; }
      .minirow { display: flex; gap: 4px; margin-bottom: 4px; }
      .minirow button {
        flex: 1; margin: 0 !important; padding: 0.3rem 0 !important;
        text-align: center !important; font-size: 0.64rem !important;
      }
      #panel label.row {
        display: flex; align-items: center; gap: 6px;
        margin: 6px 0; font-size: 0.66rem; color: #8a9aab; cursor: pointer;
      }
      #panel input[type="range"] { width: 100%; }
      #log {
        margin-top: 6px; font-size: 0.62rem; line-height: 1.8; color: #b8cbd8;
      }
      #log .cx-h {
        color: #66788a; letter-spacing: 0.1em; font-size: 0.58rem;
        margin-top: 7px; border-bottom: 1px solid rgba(120, 140, 160, 0.2);
      }
      #log .rx { display: flex; gap: 6px; align-items: baseline; }
      #log .rx b { font-weight: 600; flex-shrink: 0; }
      #log .rx span:not(.n) { flex: 1; color: #7a8ea0; font-size: 0.56rem; }
      #log .rx .n { color: #ffd24a; flex-shrink: 0; }
      #log .rx.dim b { color: #4a5866; }
      #log .rx.dim span { color: #3e4a56; }
      #log .rx.dim .n { color: #4a5866; }
      #stage { flex: 1; height: 100%; position: relative; }
      #stage canvas { display: block; }
      #tip {
        position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
        font-size: 0.66rem; letter-spacing: 0.1em; color: rgba(200, 214, 226, 0.45);
        pointer-events: none; text-align: center; line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>元素反应实验场</h1>
      <div class="sub">验证 Noita 式组合反应手感<br />弹道 × 元素 自由拼装</div>
      <div class="group">装配槽（弹道 × 元素 = 16 种技能）</div>
      <div id="slots"></div>
      <div class="group">环境投放</div>
      <div id="envs"></div>
      <div class="group">敌潮</div>
      <label class="row"><input type="checkbox" id="horde" checked /> 持续敌潮</label>
      <label class="row">密度 <input type="range" id="density" min="1" max="10" value="5" /></label>
      <label class="row"><input type="checkbox" id="mixTanker" checked /> 混入油罐机（自带油）</label>
      <label class="row"><input type="checkbox" id="mixArmor" checked /> 混入装甲机（吃DoT）</label>
      <button id="clear">清场重来</button>
      <div class="group" id="codex-title">效果图鉴</div>
      <div id="log"></div>
    </div>
    <div id="stage"><div id="tip">移动鼠标 / 手指拖动 = 驾驶战机（装配槽自动开火）<br />小心:火场 / 轰燃 / 燃烧残骸对你同样生效,别把自己点着</div></div>
    <script type="module" src="/src/demo/elemDemo.js"></script>
  </body>
</html>
