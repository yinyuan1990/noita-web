<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 混战世界 Demo（随机地形 + 载具 + 修仙者 AI）</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0d12; }
      body { font-family: "Noto Serif SC", "Source Han Serif SC", Georgia, serif; color: #e8eef4; }
      #stage { width: 100%; height: 100%; position: relative; }
      #stage canvas { display: block; }
      #hud {
        position: absolute; top: 14px; left: 14px; z-index: 2;
        padding: 12px 14px;
        background: rgba(8, 12, 18, 0.72);
        border: 1px solid rgba(120, 140, 160, 0.35);
        border-radius: 10px;
        backdrop-filter: blur(6px);
        max-width: 250px;
      }
      #hud h1 { font-size: 0.85rem; letter-spacing: 0.12em; margin-bottom: 6px; }
      #hud .row { font-size: 0.68rem; color: #9fb2c4; line-height: 1.9; }
      #hud kbd {
        display: inline-block; min-width: 1.5em; text-align: center;
        padding: 0 0.3em; margin: 0 0.15em;
        font-family: inherit; font-size: 0.66rem;
        color: #dce8f2; background: rgba(60, 80, 100, 0.5);
        border: 1px solid rgba(140, 160, 180, 0.4); border-radius: 4px;
      }
      #hud button {
        margin-top: 8px; padding: 0.4rem 0.7rem; width: 100%;
        font-family: inherit; font-size: 0.72rem; letter-spacing: 0.08em;
        color: #c5d6e4; background: rgba(20, 30, 42, 0.9);
        border: 1px solid rgba(120, 140, 160, 0.4); border-radius: 6px; cursor: pointer;
      }
      #hud button:hover { border-color: #7ea0b8; color: #fff; }
      #hud .meta { margin-top: 6px; font-size: 0.6rem; color: #66788a; }
      #hud a { color: #7ea0b8; font-size: 0.64rem; text-decoration: none; }
      #skill-tip {
        position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
        font-size: 0.7rem; letter-spacing: 0.12em; color: rgba(220, 232, 242, 0.55);
        pointer-events: none; text-align: center;
      }
      #skill-name { color: #ffd28a; }
      #status {
        position: absolute; top: 14px; right: 14px; z-index: 2;
        padding: 10px 14px; min-width: 190px;
        background: rgba(8, 12, 18, 0.72);
        border: 1px solid rgba(120, 140, 160, 0.35);
        border-radius: 10px;
        backdrop-filter: blur(6px);
        font-size: 0.68rem; color: #9fb2c4;
      }
      #status .line { display: flex; justify-content: space-between; gap: 10px; line-height: 1.9; }
      #status .val { color: #dce8f2; }
      #hp-wrap {
        width: 100%; height: 10px; margin: 4px 0 2px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(120, 140, 160, 0.35); border-radius: 5px;
        overflow: hidden;
      }
      #hp-bar { height: 100%; width: 100%; background: #6fe08a; transition: width 0.2s; }
      #log {
        position: absolute; bottom: 44px; left: 14px; z-index: 2;
        font-size: 0.64rem; color: rgba(190, 208, 224, 0.75);
        line-height: 1.9; pointer-events: none;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="hud">
        <h1>3D 混战世界</h1>
        <div class="row"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动/驾驶 · <kbd>Shift</kbd> 奔跑</div>
        <div class="row"><kbd>E</kbd> 上/下载具（坦克·战机·炮艇）</div>
        <div class="row"><kbd>空格</kbd>/点击 开炮 · <kbd>F</kbd> 徒步技能</div>
        <div class="row">战机：<kbd>R</kbd>爬升 <kbd>F</kbd>俯冲（先加速起飞）</div>
        <div class="row">鼠标拖动旋转 · 滚轮缩放</div>
        <button id="regen">重新生成地形（T）</button>
        <div class="meta">种子：<span id="seed">-</span> · 角色：three.js Soldier.glb（开源）</div>
        <div class="meta" style="margin-top:4px"><a href="/cocos-fx-3d-demo.html">← 粒子 3D Demo</a></div>
      </div>
      <div id="status">
        <div class="line"><span>生命</span><span class="val" id="hp-text">100</span></div>
        <div id="hp-wrap"><div id="hp-bar"></div></div>
        <div class="line"><span>状态</span><span class="val" id="mode">徒步</span></div>
        <div class="line"><span>击杀修仙者</span><span class="val" id="kills">0</span></div>
      </div>
      <div id="log"></div>
      <div id="skill-tip">技能：<span id="skill-name">按 F 释放</span></div>
    </div>
    <script type="module" src="/src/demo/world3dDemo.js"></script>
  </body>
</html>
