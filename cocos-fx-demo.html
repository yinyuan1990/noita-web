<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cocos 粒子移植 Demo</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #07090c; }
      body {
        font-family: "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
        color: #e8eef4;
        display: flex;
      }
      #panel {
        width: 190px;
        height: 100%;
        overflow-y: auto;
        padding: 12px 10px;
        background: rgba(10, 14, 20, 0.92);
        border-right: 1px solid rgba(120, 140, 160, 0.35);
        flex-shrink: 0;
      }
      #panel h1 { font-size: 0.85rem; letter-spacing: 0.12em; margin-bottom: 4px; }
      #panel .sub { font-size: 0.62rem; color: #8a9aab; margin-bottom: 10px; line-height: 1.6; }
      #panel button {
        display: block;
        width: 100%;
        margin-bottom: 5px;
        padding: 0.42rem 0.5rem;
        font-family: inherit;
        font-size: 0.72rem;
        letter-spacing: 0.05em;
        text-align: left;
        color: #c5d6e4;
        background: rgba(14, 18, 24, 0.9);
        border: 1px solid rgba(120, 140, 160, 0.35);
        border-radius: 6px;
        cursor: pointer;
      }
      #panel button:hover { border-color: #7ea0b8; color: #fff; }
      #panel button.active { border-color: #7ea0b8; background: rgba(30, 44, 58, 0.95); color: #fff; }
      #panel .group { font-size: 0.6rem; color: #66788a; letter-spacing: 0.12em; margin: 10px 0 5px; }
      #stage { flex: 1; height: 100%; position: relative; }
      #stage canvas { display: block; }
      #tip {
        position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
        font-size: 0.66rem; letter-spacing: 0.1em; color: rgba(200, 214, 226, 0.4);
        pointer-events: none;
      }
      label.auto {
        display: flex; align-items: center; gap: 6px;
        margin-top: 10px; font-size: 0.68rem; color: #8a9aab; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>COCOS 粒子移植</h1>
      <div class="sub">plist + 自定义曲线<br />→ Pixi 5</div>
      <div id="buttons"></div>
      <label class="auto"><input type="checkbox" id="auto" checked /> 自动轮播</label>
    </div>
    <div id="stage"><div id="tip">点击画面任意位置释放当前特效</div></div>
    <script type="module" src="/src/demo/cocosFxDemo.js"></script>
  </body>
</html>
