<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>森林俯视 Demo · 真实美术资源</title>
    <style>
      :root {
        --ink: #e8eef4;
        --dim: #8a9aab;
        --panel: rgba(10, 14, 20, 0.82);
        --line: rgba(120, 140, 160, 0.4);
        --accent: #9ed48a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #07090c; color: var(--ink);
        font-family: "Noto Serif SC", "Songti SC", Georgia, serif; }
      #app { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      #host {
        position: relative;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        background: #0a0c12; overflow: hidden;
      }
      #host canvas { display: block; width: 100% !important; height: 100% !important; }
      #hud {
        position: absolute; left: 12px; top: 10px; z-index: 3;
        font-size: 12px; line-height: 1.55; color: var(--dim); pointer-events: none;
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        padding: 0.55rem 0.75rem; max-width: 300px;
      }
      #hud b { color: var(--accent); font-weight: 600; }
      #hud kbd {
        display: inline-block; padding: 0 5px; border: 1px solid var(--line);
        border-radius: 4px; font-size: 11px; color: var(--ink);
      }
      #hint {
        position: absolute; right: 12px; bottom: 12px; z-index: 3;
        font-size: 11px; color: rgba(138,154,171,.7); pointer-events: none;
        max-width: 260px; text-align: right;
      }
      #fps {
        position: absolute; right: 12px; top: 10px; z-index: 3;
        font-size: 12px; font-variant-numeric: tabular-nums;
        color: var(--accent); pointer-events: none;
        background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
        padding: 0.25rem 0.55rem;
      }
      a.back {
        position: absolute; left: 12px; bottom: 12px; z-index: 4;
        font-size: 12px; color: var(--dim); text-decoration: none;
        border: 1px solid var(--line); border-radius: 6px; padding: 0.28rem 0.55rem;
        background: var(--panel);
      }
      a.back:hover { color: var(--ink); border-color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="host">
        <div id="hud">
          <div><b>森林俯视 Demo</b> · 真实美术 + 雨天积水</div>
          <div>雨天积水渐涨渐干 · 真贴图倒影/折射 · 可趟水踩波纹</div>
          <div style="margin-top:6px">
            <kbd>WASD</kbd> / 点地图移动（双击冲刺）· <kbd>空格</kbd> 跳跃/2 段跳 · <kbd>Q</kbd><kbd>E</kbd> 旋转 · 滚轮缩放 · <kbd>R</kbd> 雨 · <kbd>X</kbd> 雪 · <kbd>L</kbd> 闪电 · <kbd>[</kbd><kbd>]</kbd> 水位 · <kbd>N</kbd> 昼夜<br/><kbd>1</kbd> 复古掌机 · <kbd>2</kbd> 漩涡 · <kbd>3</kbd> 果冻 · <kbd>4</kbd> 迷幻 · <kbd>F</kbd> 按住蓄力气功波 · <kbd>C</kbd> 放波运镜开关 · 跳跃落地有冲击波<br/>底部面板：切换主角 · 点按钮预览该角色的技能动作
          </div>
        </div>
        <a class="back" href="/">← 回主站</a>
        <div id="fps">-- FPS</div>
        <div id="hint">素材：LPC Forest tiles（CC-BY-SA）<br/>/res/tiles/lpc_forest/CREDITS.txt</div>
      </div>
    </div>
    <script type="module" src="/src/demo/forestDemo.js"></script>
  </body>
</html>
